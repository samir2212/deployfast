<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}snip.{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0e;
      --surface: #131316;
      --border: #222228;
      --accent: #e8ff47;
      --accent-dim: rgba(232, 255, 71, 0.12);
      --text: #f0f0f2;
      --muted: #6b6b78;
      --danger: #ff4757;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    body {
      background-image:
        radial-gradient(ellipse 60% 40% at 80% -10%, rgba(232,255,71,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at -10% 80%, rgba(100,80,255,0.05) 0%, transparent 60%);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      text-decoration: none;
    }

    .logo span { color: var(--accent); }

    nav a {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--text); }
    nav a.active { color: var(--accent); }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(232,255,71,0.25);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      margin-bottom: 1.2rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">snip<span>.</span></a>
    <a href="/stats" {% if request.path == '/stats' %}class="active"{% endif %}>Stats</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
